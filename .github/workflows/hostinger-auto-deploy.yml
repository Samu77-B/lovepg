name: Hostinger Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-auto-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Hostinger Deploy Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Call Hostinger webhook
        env:
          HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOSTINGER_DEPLOY_WEBHOOK" ]; then
            echo "Missing secret: HOSTINGER_DEPLOY_WEBHOOK"
            exit 1
          fi

          # Hostinger's Git webhook expects a GitHub-style push payload
          # (the same shape GitHub sends to a repository webhook), not an empty POST.
          payload=$(jq -n \
            --arg ref "refs/heads/${GITHUB_REF_NAME}" \
            --arg sha "${GITHUB_SHA}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            '{
              ref: $ref,
              after: $sha,
              repository: {
                full_name: $repo,
                clone_url: ("https://github.com/" + $repo + ".git")
              },
              head_commit: { id: $sha }
            }')

          tmp="$(mktemp)"
          code=$(curl --show-error --silent \
            --output "$tmp" \
            --write-out "%{http_code}" \
            -X POST \
            -H "User-Agent: GitHub-Hookshot" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${GITHUB_RUN_ID}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "payload=${payload}" \
            "$HOSTINGER_DEPLOY_WEBHOOK")

          echo "Hostinger HTTP ${code}"
          cat "$tmp"
          echo

          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            exit 0
          fi

          # 409/422: deploy already running, or Hostinger's GitHub App already
          # received the push. The site still updates from that Git connection.
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            echo "Hostinger returned ${code}. If Git is connected in hPanel, this push still deploys from GitHub."
            exit 0
          fi

          exit 1
